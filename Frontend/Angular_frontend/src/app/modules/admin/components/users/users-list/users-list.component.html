<div class="users-container">
  <div class="header">
    <h1>Gestión de Usuarios</h1>
    <button mat-raised-button color="primary">
      <mat-icon>person_add</mat-icon>
      Nuevo Usuario
    </button>
  </div>

  <mat-card class="users-card">
    <mat-card-content>
      <table mat-table [dataSource]="users" matSort class="users-table">
        <ng-container matColumnDef="username">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Usuario</th>
          <td mat-cell *matCellDef="let user">{{ user.username }}</td>
        </ng-container>

        <ng-container matColumnDef="email">
          <th mat-header-cell *matHeaderCellDef>Email</th>
          <td mat-cell *matCellDef="let user">{{ user.email }}</td>
        </ng-container>

        <ng-container matColumnDef="full_name">
          <th mat-header-cell *matHeaderCellDef>Nombre Completo</th>
          <td mat-cell *matCellDef="let user">{{ user.first_name }} {{ user.last_name }}</td>
        </ng-container>

        <ng-container matColumnDef="role">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Rol</th>
          <td mat-cell *matCellDef="let user">
            <mat-chip [color]="getRoleColor(user.role)" selected>
              {{ getRoleLabel(user.role) }}
            </mat-chip>
          </td>
        </ng-container>

        <ng-container matColumnDef="is_active">
          <th mat-header-cell *matHeaderCellDef>Estado</th>
          <td mat-cell *matCellDef="let user">
            <mat-chip [color]="user.is_active ? 'primary' : 'warn'" selected>
              {{ user.is_active ? 'Activo' : 'Inactivo' }}
            </mat-chip>
          </td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Acciones</th>
          <td mat-cell *matCellDef="let user">
            <button mat-icon-button [matMenuTriggerFor]="menu">
              <mat-icon>more_vert</mat-icon>
            </button>
            <mat-menu #menu="matMenu">
              <button mat-menu-item (click)="editUser(user)">
                <mat-icon>edit</mat-icon>
                <span>Editar</span>
              </button>
              <button mat-menu-item (click)="toggleUserStatus(user)">
                <mat-icon>{{ user.is_active ? 'block' : 'check_circle' }}</mat-icon>
                <span>{{ user.is_active ? 'Desactivar' : 'Activar' }}</span>
              </button>
            </mat-menu>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>

      <mat-paginator [pageSizeOptions]="[5, 10, 20, 50]" showFirstLastButtons></mat-paginator>
    </mat-card-content>
  </mat-card>
</div>
