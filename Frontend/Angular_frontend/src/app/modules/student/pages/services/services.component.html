<div class="services-container">
  <h1>Servicios Disponibles</h1>

  <mat-grid-list cols="3" rowHeight="300px" class="services-grid">
    <mat-grid-tile *ngFor="let service of services">
      <mat-card class="service-card">
        <mat-card-header>
          <mat-card-title>{{ service.nombre }}</mat-card-title>
          <mat-card-subtitle>
            <mat-chip [color]="getServiceTypeColor(service.tipo)" selected>
              {{ getServiceTypeLabel(service.tipo) }}
            </mat-chip>
          </mat-card-subtitle>
        </mat-card-header>

        <mat-card-content>
          <p>{{ service.descripcion }}</p>
        </mat-card-content>

        <mat-card-actions>
          <button mat-raised-button color="primary" (click)="viewServiceDetails(service)">
            <mat-icon>visibility</mat-icon>
            Ver Detalles
          </button>
        </mat-card-actions>
      </mat-card>
    </mat-grid-tile>
  </mat-grid-list>
</div>
