<div class="services-container">
  <div class="header">
    <h1>Gestión de Servicios</h1>
    <button mat-raised-button color="primary" (click)="createService()">
      <mat-icon>add</mat-icon>
      Nuevo Servicio
    </button>
  </div>

  <mat-card class="services-card">
    <mat-card-content>
      <table mat-table [dataSource]="services" matSort class="services-table">
        <!-- Nombre Column -->
        <ng-container matColumnDef="nombre">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Nombre</th>
          <td mat-cell *matCellDef="let service">{{ service.nombre }}</td>
        </ng-container>

        <!-- Tipo Column -->
        <ng-container matColumnDef="tipo">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Tipo</th>
          <td mat-cell *matCellDef="let service">
            <mat-chip [color]="getServiceTypeColor(service.tipo)" selected>
              {{ getServiceTypeLabel(service.tipo) }}
            </mat-chip>
          </td>
        </ng-container>

        <!-- Descripción Column -->
        <ng-container matColumnDef="descripcion">
          <th mat-header-cell *matHeaderCellDef>Descripción</th>
          <td mat-cell *matCellDef="let service">
            <span [matTooltip]="service.descripcion">
              {{ service.descripcion.length > 50 ? service.descripcion.substring(0, 50) + '...' : service.descripcion }}
            </span>
          </td>
        </ng-container>

        <!-- Activo Column -->
        <ng-container matColumnDef="activo">
          <th mat-header-cell *matHeaderCellDef>Estado</th>
          <td mat-cell *matCellDef="let service">
            <mat-chip [color]="service.activo ? 'primary' : 'warn'" selected>
              {{ service.activo ? 'Activo' : 'Inactivo' }}
            </mat-chip>
          </td>
        </ng-container>

        <!-- Acciones Column -->
        <ng-container matColumnDef="acciones">
          <th mat-header-cell *matHeaderCellDef>Acciones</th>
          <td mat-cell *matCellDef="let service">
            <button mat-icon-button [matMenuTriggerFor]="menu" aria-label="Opciones">
              <mat-icon>more_vert</mat-icon>
            </button>
            <mat-menu #menu="matMenu">
              <button mat-menu-item (click)="toggleServiceStatus(service)">
                <mat-icon>{{ service.activo ? 'block' : 'check_circle' }}</mat-icon>
                <span>{{ service.activo ? 'Desactivar' : 'Activar' }}</span>
              </button>
              <button mat-menu-item>
                <mat-icon>edit</mat-icon>
                <span>Editar</span>
              </button>
              <button mat-menu-item color="warn">
                <mat-icon>delete</mat-icon>
                <span>Eliminar</span>
              </button>
            </mat-menu>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>

      <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>
    </mat-card-content>
  </mat-card>
</div>
